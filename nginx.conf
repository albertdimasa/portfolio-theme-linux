server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(ico|png|svg|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
